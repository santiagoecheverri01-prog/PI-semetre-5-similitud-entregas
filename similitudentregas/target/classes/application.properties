# Conexión al contenedor de PostgreSQL en el nuevo puerto 5433
spring.datasource.url=jdbc:postgresql://localhost:5433/similitud_db
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate/JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# ==========================================
# 1. LOGS DE TU PROPIO CÓDIGO (EL MÁS DETALLADO)
# ==========================================
# Muestra cada paso que den tus clases dentro del paquete com.novadevs...
logging.level.com.novadevs.similitudentregas=TRACE

# ==========================================
# 2. LOGS DE BASE DE DATOS (HIBERNATE Y POSTGRESQL)
# ==========================================
# Formatea el SQL para que se vea bonito y fácil de leer
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Muestra la consulta SQL exacta que se ejecuta
logging.level.org.hibernate.SQL=DEBUG
# ¡Súper útil! Muestra los valores reales que reemplazan a los signos de interrogación (?) en el SQL
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================================
# 3. LOGS DE PETICIONES HTTP Y SEGURIDAD
# ==========================================
# Rastrea cómo entra la petición desde Postman y a qué controlador va
logging.level.org.springframework.web=TRACE
# Muestra cada filtro de seguridad que evalúa la petición
logging.level.org.springframework.security=TRACE

# ==========================================
# 4. LOGS DE TRANSACCIONES
# ==========================================
# Muestra cuándo se abre y se cierra una transacción en la base de datos (el @Transactional)
logging.level.org.springframework.transaction=TRACE